name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog yosys verilator python3-numpy python3-matplotlib

      - name: Lint (Verilator -Wall)
        run: make lint

      - name: Functional regression (RTL)
        run: make test

      - name: Logic synthesis (Yosys)
        run: make synth

      - name: Gate-level simulation (synthesized netlist)
        run: make gls

      - name: ADC performance analysis (INL/DNL/ENOB)
        run: make analyze

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: |
            build/*.log
            build/synth_stat.txt
            build/results.json
            docs/images/*.png
